[project]
name = "pathmemory"
version = "0.1.0"
description = "FalkorDB procedural memory for browser agents: reuse, compose and repair verified UI routes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agentlab>=0.4.2",
    "falkordb>=1.8.0",
    "fastapi>=0.143.2",
    "mcp>=2.3.0",
    "pytest>=9.1.1",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
pathmemory-ui = "pathmemory.ui:main"
pathmemory-mcp = "pathmemory.mcp_server:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
markers = [
    "integration: needs local containers (FalkorDB and/or Gitea)",
    "falkordb: needs the FalkorDB container",
    "gitea: needs the Gitea container (the reset test recreates it)",
]
