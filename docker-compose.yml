# fixed project name: a second checkout reuses these containers instead of starting new ones on the same ports
name: t12-pathmemory

services:
  falkordb:
    image: falkordb/falkordb@sha256:e2765e207e5ba4ee90e47ed31eb7491ad6dd3d42241c326e429375c02ad9882f
    ports:
      - "6391:6379"
      - "3391:3000"

  gitea:
    image: gitea/gitea:1.22
    environment:
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__security__INSTALL_LOCK=true
      - GITEA__server__ROOT_URL=http://localhost:3300/
      - GITEA__server__HTTP_PORT=3000
      - GITEA__service__DISABLE_REGISTRATION=true
      - GITEA__service__REQUIRE_SIGNIN_VIEW=false
      - GITEA__mailer__ENABLED=false
      - GITEA__log__LEVEL=Warn
    ports:
      - "3300:3000"
    tmpfs:
      - /data
